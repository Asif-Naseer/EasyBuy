<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f8f9fa;
            font-family:Arial, Helvetica, sans-serif;
        }

        .checkout-box{
            max-width:800px;
            margin:50px auto;
            background:#fff;
            padding:35px;
            border-radius:15px;
            border:1px solid #dee2e6;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }

        h2{
            text-align:center;
            font-weight:bold;
            margin-bottom:30px;
            color:#212529;
        }

        .form-label{
            font-weight:600;
            color:#495057;
        }

        .form-control,
        .form-select{
            border-radius:8px;
            padding:12px;
            border:1px solid #ced4da;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#0d6efd;
            box-shadow:0 0 0 .2rem rgba(13,110,253,.15);
        }

        .btn-place{
            background:#198754;
            color:#fff;
            font-size:18px;
            padding:12px;
            border-radius:8px;
            border:none;
        }

        .btn-place:hover{
            background:#157347;
        }

        .icon{
            margin-right:8px;
            color:#0d6efd;
        }
    </style>

</head>
<body>

<div class="container">

<div class="checkout-box">

<h2><i class="bi bi-truck icon"></i>Checkout</h2>

<form action="success.html">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-person icon"></i>Full Name
</label>

<input type="text" class="form-control" placeholder="Enter your full name">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-telephone icon"></i>Phone Number
</label>

<input type="text" class="form-control" placeholder="Enter phone number">
</div>

<div class="col-12 mb-3">
<label class="form-label">
<i class="bi bi-envelope icon"></i>Email Address
</label>

<input type="email" class="form-control" placeholder="Enter email">
</div>

<div class="col-12 mb-3">
<label class="form-label">
<i class="bi bi-house icon"></i>Address
</label>

<textarea class="form-control" rows="3" placeholder="Enter your address"></textarea>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-building icon"></i>City
</label>

<input type="text" class="form-control" placeholder="Enter city">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-geo-alt icon"></i>PIN Code
</label>

<input type="text" class="form-control" placeholder="Enter PIN Code">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-globe icon"></i>State
</label>

<select class="form-select">
<option selected>Select State</option>
<option>Kerala</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>
<option>Goa</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
<i class="bi bi-credit-card icon"></i>Payment Method
</label>

<select class="form-select">
<option selected>Cash on Delivery</option>
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>
</select>
</div>

<div class="col-12 mt-3">

<button class="btn btn-place w-100">
<i class="bi bi-bag-check-fill"></i>
Place Order
</button>

</div>

</div>

</form>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
